name: Docker Dev containers for HSG
on:
  push:
    branches: [main]
  pull_request:
  schedule:
      - cron: "0 0/12 * * *"
  workflow_dispatch:

# A newer push to the same ref cancels the run it supersedes (PRs and main),
# so a 3+ hour build is not queued behind an obsolete one. Scheduled runs never
# cancel anything: they wait for a running build and are replaced if a newer
# one queues up behind them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  IMAGE: joewiz/hsg-project
  TEST_TAG: joewiz/hsg-project:exist-ci
  # EXIST_VER: 6.2.0

jobs:
  # Each platform is built and tested natively on its own runner (no QEMU).
  # On main, every job pushes its image by digest; `merge` combines them
  # into the multi-arch :latest / :v2 tags.
  build:
    name: Build and Test Images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Timeouts are deliberately not armed yet. Data from a cold run (schedule,
    # 2026-10-15): whole job ~4h06m on both platforms, of which the populate
    # layer (deploying the xar-full data package) is ~3h24m, layer export and
    # cache push ~25m, boot + tests ~3m. A warm run is a few minutes.
    # Once a few successful runs confirm those numbers, arm something like
    # timeout-minutes: 300 here (GitHub's own limit is 360), plus
    # timeout-minutes: 15 on "Pull pushed image for testing".
    # timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            cache: buildcache-x86
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache: buildcache-arm
    steps:

    # SETUP
      - name: Maximize build space
        if: matrix.arch == 'amd64'
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /var/lib/docker/
          root-reserve-mb: 2048
          temp-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # Root/temp have minimal free space after LVM. Containerd (used by
      # "load: true") writes to /var/lib/containerd on root and runs out of space.
      # Redirect containerd root to the 102GB Docker volume.
      - name: Configure containerd to use Docker volume
        if: matrix.arch == 'amd64'
        run: |
          sudo mkdir -p /etc/containerd /var/lib/docker/containerd
          if sudo containerd config default > /tmp/containerd.toml 2>/dev/null; then
            sudo sed -i 's|root = .*|root = "/var/lib/docker/containerd"|' /tmp/containerd.toml
            grep -q 'root = ' /tmp/containerd.toml || echo 'root = "/var/lib/docker/containerd"' | sudo tee -a /tmp/containerd.toml
          else
            printf 'version = 2\nroot = "/var/lib/docker/containerd"\n' | sudo tee /tmp/containerd.toml
          fi
          sudo mv /tmp/containerd.toml /etc/containerd/config.toml
          sudo systemctl restart containerd 2>/dev/null || true

      # The arm64 runner has no LVM volume to maximize; free what we can instead.
      - name: Free disk space (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo docker image prune --all --force || true

      # Limit container logs to prevent filling disk (buildkit, exist-ci during tests)
      - name: Configure Docker log limits
        run: |
          sudo mkdir -p /etc/docker
          if [ -s /etc/docker/daemon.json ]; then
            sudo python3 -c "
          import json
          with open('/etc/docker/daemon.json') as f: c=json.load(f)
          c.setdefault('log-opts',{})['max-size']='10m'
          c['log-opts']['max-file']='3'
          with open('/etc/docker/daemon.json','w') as f: json.dump(c,f,indent=2)
          "
          else
            echo '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}' | sudo tee /etc/docker/daemon.json
          fi

      - name: Restart docker
        run: sudo service docker restart

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Make buildkit default
        uses: docker/setup-buildx-action@v4
        id: buildx
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Install bats
        run: sudo apt-get install bats

      #  sanity check
      - name: check os
        run: |
          uname -m
          df -h / /var/lib/docker
          df -ih /var/lib/docker

      - name: Check config
        run: docker info

      - name: Image metadata
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # BUILD
      # see https://github.com/felipecrs/docker-images/commit/f74a9532da6549d9562574eb1709ef50cedb640c
      # The image is built exactly once. On PRs it is loaded into the local
      # daemon for testing. On main it is pushed untagged, by digest, and the
      # tests run against that pushed digest: the tags are only created in the
      # `merge` job once both platforms have passed. A second `build` for the
      # push would redo the multi-hour populate layer whenever the cache missed.
      - name: Build image
        id: build
        # timeout-minutes: 285  # cold build ~3h50m, see the job-level note
        env:
          BUILDKIT_PROGRESS: plain
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.HSG_READ_TOKEN }}
          load: ${{ github.ref != 'refs/heads/main' }}
          tags: ${{ github.ref != 'refs/heads/main' && env.TEST_TAG || '' }}
          outputs: ${{ github.ref == 'refs/heads/main' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.version=${{ github.ref_name }}
          # Attestations are attached to the pushed image only (the PR build is
          # loaded into the local daemon, which cannot hold them). max records
          # the Dockerfile, build args and base image digests.
          provenance: ${{ github.ref == 'refs/heads/main' && 'mode=max' || 'false' }}
          sbom: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:${{ matrix.cache }},mode=max

      - name: Disk space after build
        if: always()
        run: |
          df -h / /var/lib/docker
          docker system df

      - name: Pull pushed image for testing
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          docker tag ${{ env.IMAGE }}@${{ steps.build.outputs.digest }} ${{ env.TEST_TAG }}

      # TEST
      - name: Start exist-ci containers
        run: |
          docker run -dit -p 8080:8080 --health-interval 4s --name exist-ci --rm ${{ env.TEST_TAG }}

      - name: wait for boot to finish
        timeout-minutes: 5
        run: |
          while ! docker logs exist-ci | grep -q "Server has started"; \
          do sleep 2s; \
          done
          sleep 12s

      - name: Run tests
        run: bats --tap test/*.bats

      - name: Check disk space on failure
        if: failure()
        run: |
          echo "=== Disk space after failed build ==="
          df -h / /var/lib/docker /var/lib/containerd 2>/dev/null || df -h
          df -ih /var/lib/docker
          echo "=== Docker system df ==="
          docker system df
          echo "=== Containerd content ==="
          du -sh /var/lib/containerd/io.containerd.content.v1.content/ || echo "Not found"
          echo "=== Docker overlay2 ==="
          du -sh /var/lib/docker/overlay2/ || echo "Not found"
          echo "=== Buildkit state ==="
          du -sh /var/lib/docker/buildx/ || echo "Not found"

      - name: debug logs
        if: failure()
        run: docker logs exist-ci | grep 'ERROR'

      - name: Copy logs on failure
        if: failure()
        run: |
          echo "Copying logs..."
          docker cp exist-ci:/exist/logs/exist.log ./exist.log

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hsg-project-failed-log-${{ matrix.arch }}
          path: exist.log

      - name: Stop exist-ci container
        run: docker stop exist-ci

      - name: Export digest
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Release: combine the per-platform images into one multi-arch tag
  merge:
    name: Publish multi-arch tags
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write      # sign with the workflow's OIDC identity
      attestations: write  # store the attestation on GitHub
      packages: write      # push the attestation to the registry
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Create manifest list and push :latest, :v2
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:v2 \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:latest

      # Sign a SLSA provenance statement for the published multi-arch index, so
      # consumers can verify where the image came from:
      #   gh attestation verify oci://joewiz/hsg-project:latest -R Jinntec/hsg-project
      - name: Get index digest
        id: index
        run: |
          digest=$(docker buildx imagetools inspect ${{ env.IMAGE }}:latest --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
